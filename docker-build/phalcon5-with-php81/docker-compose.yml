services:

# ======================================================================
# PHP 8.1.x | Phalcon 5.23.x
# ======================================================================

  php:
    image: keptcode/php81phalcon5:5.23.0
    container_name: php81fpm-phalcon5
    working_dir: /usr/share/nginx/html
    restart: always
    environment:
      - VIRTUAL_PORT=91
      - TERM=xterm
    volumes:
      - ./nginx/www:/usr/share/nginx/html
    ports:
      - "91:9000"
    networks:
      - "php81fpm_nginx_network"

# ======================================================================
# Web Server
# ======================================================================

  nginx:
    image: nginx:1.31.10-alpine3.24
    container_name: php81fpm-nginx
    working_dir: /usr/share/nginx/html
    restart: always
    environment:
      - VIRTUAL_HOST=localhost
      - VIRTUAL_PORT=81
      - NGINX_HOST=localhost
      - NGINX_PORT=81
      - TERM=xterm
    volumes:
      - ./nginx/www:/usr/share/nginx/html
      - ./nginx/localhost.conf:/etc/nginx/conf.d/default.conf
    links:
      - "php:php81fpm"
    ports:
      - "81:80"
    networks:
      - "php81fpm_nginx_network"

networks:
  php81fpm_nginx_network:
    driver: bridge